name: e_campus
description: E-Campus college management application for students, teachers, and administrators.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^3.15.2
  firebase_auth: ^5.6.2
  cloud_firestore: ^5.6.12
  firebase_storage: ^12.4.10
  firebase_messaging: ^15.2.10
  firebase_app_check: ^0.3.2+10
  flutter_riverpod: ^2.6.1
  go_router: ^16.2.0
  intl: ^0.19.0
  file_picker: ^8.3.7
  url_launcher: ^6.3.2
  http: ^1.5.0
  flutter_markdown: ^0.7.7+1
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true